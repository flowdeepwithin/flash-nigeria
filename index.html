<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="theme-color" content="#0d0d0d"/>
<meta name="description" content="Flash Nigeria — Breaking Nigeria. Every Second."/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="Flash Nigeria"/>
<link rel="manifest" href="manifest.json"/>
<title>Flash Nigeria ⚡</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --black:#0d0d0d;--gold:#FFD700;--gold-light:#fff8e0;--gold-dark:#856000;
  --red:#c00;--green:#1a6e3c;--purple:#6b1a6e;--brown:#8b4000;
  --bg:#ffffff;--bg2:#f5f5f5;--text:#111;--text2:#555;--border:#e0e0e0;
}
body.dark{
  --bg:#111;--bg2:#1a1a1a;--text:#f0f0f0;--text2:#aaa;--border:#2a2a2a;
  --gold-light:#2a2000;--gold-dark:#FFD700;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden;transition:background 0.3s,color 0.3s;}
.header{background:var(--black);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:6px;text-decoration:none;}
.logo-text{font-size:19px;font-weight:700;color:#fff;letter-spacing:-0.5px;}
.logo-text span{color:var(--gold);}
.header-actions{display:flex;gap:10px;align-items:center;}
.header-btn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px;display:flex;align-items:center;position:relative;}
.badge-dot{position:absolute;top:0;right:0;background:var(--red);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;display:none;}
.badge-dot.show{display:flex;}
.breaking-bar{background:var(--red);padding:7px 16px;display:flex;align-items:center;gap:10px;overflow:hidden;}
.breaking-label{color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border:1px solid rgba(255,255,255,0.6);border-radius:3px;white-space:nowrap;letter-spacing:0.8px;}
.breaking-ticker{flex:1;overflow:hidden;white-space:nowrap;}
.breaking-ticker-inner{display:inline-block;animation:ticker 40s linear infinite;}
.breaking-ticker-inner:hover{animation-play-state:paused;}
@keyframes ticker{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.breaking-item{color:#fff;font-size:12px;font-weight:500;margin-right:48px;}
.cats-wrap{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:49px;z-index:99;}
.cats{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;}
.cats::-webkit-scrollbar{display:none;}
.cat-btn{padding:6px 16px;border-radius:20px;font-size:13px;white-space:nowrap;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:var(--bg2);font-family:inherit;transition:all 0.15s;}
.cat-btn.active{background:var(--black);color:var(--gold);border-color:var(--black);font-weight:600;}
.feed{padding:0 0 80px;}
.section-label{font-size:11px;font-weight:700;color:var(--text2);padding:14px 16px 8px;text-transform:uppercase;letter-spacing:0.8px;display:flex;align-items:center;gap:8px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}
.featured-card{margin:0 16px 8px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--bg);}
.featured-img{height:170px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#1a1a1a;}
.featured-img img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;}
.featured-img-fallback{font-size:60px;position:relative;z-index:1;}
.featured-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.75));padding:12px;z-index:2;}
.featured-badge{display:inline-block;background:var(--gold);color:var(--black);font-size:10px;font-weight:700;padding:3px 8px;border-radius:3px;letter-spacing:0.5px;margin-bottom:4px;}
.featured-source-pill{background:rgba(0,0,0,0.6);color:var(--gold);font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600;}
.featured-body{padding:12px 14px;}
.featured-title{font-size:16px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:10px;cursor:pointer;}
.featured-meta{display:flex;align-items:center;justify-content:space-between;}
.meta-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.time-tag{font-size:12px;color:var(--text2);}
.ai-btn{font-size:11px;background:var(--gold-light);color:var(--gold-dark);border:none;padding:4px 10px;border-radius:20px;cursor:pointer;font-family:inherit;font-weight:600;}
.wa-btn{font-size:11px;background:#25D366;color:#fff;border:none;padding:4px 10px;border-radius:20px;cursor:pointer;font-family:inherit;font-weight:600;}
.action-btns{display:flex;gap:6px;align-items:center;}
.icon-btn{background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer;padding:4px;}
.ai-summary-box{background:var(--gold-light);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:10px 14px;margin:0 16px 10px;font-size:13px;color:var(--gold-dark);line-height:1.6;display:none;}
.ai-summary-box.visible{display:block;}
.news-card{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;background:var(--bg);transition:background 0.1s;}
.news-card:hover{background:var(--bg2);}
.news-card.read{opacity:0.5;}
.news-thumb{width:72px;height:72px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;position:relative;}
.news-thumb img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;}
.thumb-politics{background:linear-gradient(135deg,#1a1a1a,#333);}
.thumb-entertainment{background:linear-gradient(135deg,#3d1a6e,#1e0d36);}
.thumb-business{background:linear-gradient(135deg,#5c2800,#3a1800);}
.thumb-sports{background:linear-gradient(135deg,#0d4726,#062d17);}
.thumb-lifestyle{background:linear-gradient(135deg,#4a003a,#2d0023);}
.thumb-tech{background:linear-gradient(135deg,#002a5c,#001a38);}
.thumb-default{background:linear-gradient(135deg,#1a1a1a,#333);}
.thumb-emoji{position:relative;z-index:1;}
.news-body{flex:1;min-width:0;}
.news-cat{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
.cat-politics{color:var(--red);}
.cat-entertainment{color:var(--purple);}
.cat-business{color:var(--brown);}
.cat-sports{color:var(--green);}
.cat-lifestyle{color:#c0006e;}
.cat-tech{color:#0055cc;}
.cat-default{color:var(--text2);}
.news-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.35;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.news-foot{display:flex;align-items:center;justify-content:space-between;}
.news-source{font-size:11px;color:var(--text2);}
.news-actions{display:flex;gap:4px;}
.news-actions button{background:none;border:none;font-size:15px;cursor:pointer;padding:2px;}
.trending-section{padding:14px 16px 10px;}
.trend-header{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.trend-tags{display:flex;flex-wrap:wrap;gap:8px;}
.trend-tag{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:5px 13px;font-size:12px;color:var(--text);cursor:pointer;transition:all 0.15s;}
.trend-tag:hover{border-color:var(--gold);color:var(--gold-dark);background:var(--gold-light);}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg);border-top:1px solid var(--border);display:flex;z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;cursor:pointer;color:var(--text2);font-size:10px;border:none;background:none;font-family:inherit;transition:color 0.15s;position:relative;}
.nav-item.active{color:var(--black);}
body.dark .nav-item.active{color:var(--gold);}
.nav-icon{font-size:22px;}
.nav-badge{position:absolute;top:6px;right:calc(50% - 18px);background:var(--red);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 3px;}
.nav-badge.show{display:flex;}
#page-saved,#page-trending,#page-search{display:none;padding:0 0 80px;}
.search-bar{padding:12px 16px;position:sticky;top:49px;background:var(--bg);z-index:98;border-bottom:1px solid var(--border);}
.search-wrap{display:flex;align-items:center;background:var(--bg2);border-radius:24px;border:1px solid var(--border);padding:8px 14px;gap:8px;}
.search-wrap input{flex:1;border:none;background:none;font-size:14px;color:var(--text);font-family:inherit;outline:none;}
.loading-state{padding:40px 16px;text-align:center;color:var(--text2);}
.loading-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{padding:40px 16px;text-align:center;}
.empty-icon{font-size:40px;margin-bottom:8px;}
.empty-text{color:var(--text2);font-size:14px;}
.flash-strip{height:3px;background:var(--gold);}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.refresh-bar{background:var(--gold-light);color:var(--gold-dark);font-size:12px;font-weight:600;text-align:center;padding:6px;cursor:pointer;display:none;}
.refresh-bar.show{display:block;}
.source-card{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);}
.source-dot{width:10px;height:10px;border-radius:50%;background:var(--green);}
.install-banner{background:var(--gold-light);border:1px solid var(--gold);border-radius:10px;margin:12px 16px;padding:12px 14px;display:none;align-items:center;gap:12px;}
.install-banner-text{flex:1;font-size:13px;color:var(--gold-dark);font-weight:500;}
.install-banner-btn{background:var(--black);color:var(--gold);border:none;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.install-banner-close{background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer;}
</style>
</head>
<body>
<div class="flash-strip"></div>
<div class="header">
  <a class="logo" href="#"><span style="color:var(--gold);font-size:20px;">⚡</span><span class="logo-text">FLASH <span>NIGERIA</span></span></a>
  <div class="header-actions">
    <button class="header-btn" onclick="toggleDark()" id="darkBtn" title="Toggle dark mode">🌙</button>
    <button class="header-btn" onclick="refreshFeed()" title="Refresh">
      🔄<span class="badge-dot" id="newBadge">0</span>
    </button>
  </div>
</div>
<div class="breaking-bar">
  <span class="breaking-label">⚡ FLASH</span>
  <div class="breaking-ticker"><span class="breaking-ticker-inner" id="breakingTicker">Loading breaking news...</span></div>
</div>
<div class="refresh-bar" id="refreshBar" onclick="applyNewArticles()">⚡ New stories available — tap to refresh</div>

<div id="page-home">
  <div class="install-banner" id="installBanner">
    <span style="font-size:22px;">📲</span>
    <span class="install-banner-text">Add Flash Nigeria to your home screen!</span>
    <button class="install-banner-btn" id="installBtn">Install</button>
    <button class="install-banner-close" onclick="document.getElementById('installBanner').style.display='none'">✕</button>
  </div>
  <div class="cats-wrap">
    <div class="cats" id="catBar">
      <button class="cat-btn active" data-cat="all">All</button>
      <button class="cat-btn" data-cat="politics">Politics</button>
      <button class="cat-btn" data-cat="entertainment">Entertainment</button>
      <button class="cat-btn" data-cat="sports">Sports</button>
      <button class="cat-btn" data-cat="business">Business</button>
      <button class="cat-btn" data-cat="lifestyle">Lifestyle</button>
      <button class="cat-btn" data-cat="tech">Tech</button>
    </div>
  </div>
  <div class="feed" id="mainFeed">
    <div class="loading-state"><div class="loading-spinner"></div><div>Fetching latest Naija news...</div></div>
  </div>
</div>

<div id="page-trending">
  <div style="padding:14px 16px 0;"><div class="section-label">🔥 Trending in Nigeria</div></div>
  <div id="trendingFull" style="padding:0 16px 16px;"></div>
</div>

<div id="page-search">
  <div class="search-bar">
    <div class="search-wrap">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Search Nigerian news..." oninput="doSearch(this.value)"/>
    </div>
  </div>
  <div id="searchResults" style="padding-top:8px;"></div>
</div>

<div id="page-saved">
  <div style="padding:14px 16px 0;"><div class="section-label">🔖 Saved Articles</div></div>
  <div id="savedList"></div>
</div>

<div class="bottom-nav">
  <button class="nav-item active" data-page="home" onclick="switchPage('home',this)">
    <span class="nav-icon">🏠</span>Home
  </button>
  <button class="nav-item" data-page="trending" onclick="switchPage('trending',this)">
    <span class="nav-icon">⚡</span>Flash
  </button>
  <button class="nav-item" data-page="search" onclick="switchPage('search',this)">
    <span class="nav-icon">🔍</span>Search
  </button>
  <button class="nav-item" data-page="saved" onclick="switchPage('saved',this)">
    <span class="nav-icon">🔖</span>Saved
    <span class="nav-badge" id="savedBadge">0</span>
  </button>
</div>
<div class="toast" id="toast"></div>

<script>
const RSS2JSON = 'https://api.rss2json.com/v1/api.json?rss_url=';
const RSS_SOURCES = [
  {name:'Punch',url:RSS2JSON+encodeURIComponent('https://feeds.punch.ng/'),cat:'politics'},
  {name:'Vanguard',url:RSS2JSON+encodeURIComponent('https://www.vanguardngr.com/feed/'),cat:'business'},
  {name:'TheCable',url:RSS2JSON+encodeURIComponent('https://www.thecable.ng/feed'),cat:'politics'},
  {name:'BellaNaija',url:RSS2JSON+encodeURIComponent('https://www.bellanaija.com/feed/'),cat:'entertainment'},
  {name:'Legit.ng',url:RSS2JSON+encodeURIComponent('https://www.legit.ng/rss/all.rss'),cat:'entertainment'},
  {name:'Premium Times',url:RSS2JSON+encodeURIComponent('https://www.premiumtimesng.com/feed/'),cat:'politics'},
  {name:'Channels TV',url:RSS2JSON+encodeURIComponent('https://www.channelstv.com/feed/'),cat:'politics'},
  {name:'Naijaloaded',url:RSS2JSON+encodeURIComponent('https://naijaloaded.com.ng/feed/'),cat:'entertainment'},
  {name:'Tech Cabal',url:RSS2JSON+encodeURIComponent('https://techcabal.com/feed/'),cat:'tech'},
  {name:'Nairametrics',url:RSS2JSON+encodeURIComponent('https://nairametrics.com/feed/'),cat:'business'},
];

const CAT_KEYWORDS = {
  politics:['tinubu','senate','inec','government','election','minister','aso rock','fec','presidency','governor','reps','assembly','police','army','military','court','supreme','tribunal','obi','atiku','apc','pdp','labour party','state house','presidency','CBN','naira exchange','lawmakers'],
  entertainment:['music','award','film','movie','nollywood','afrobeats','celebrity','singer','actor','actress','wizkid','burna','davido','kizz','tems','rema','show','concert','fashion','style','bbnaija','big brother','reality','comedy','skit','instagram','tiktok','yul edochie','ini edo','mercy','tacha'],
  sports:['eagles','super eagles','soccer','football','afcon','premier league','basketball','athletics','olympics','chelsea','arsenal','man utd','liverpool','match','goal','fifa','caf','transfer','coach','stadium','naija','sport','serie a','laliga'],
  business:['economy','gdp','inflation','market','stock','investment','oil','gas','dangote','fintech','startup','bank','forex','naira','dollar','trade','export','import','agric','revenue','budget','firs','customs','bond','interest rate','mtn','airtel','access bank','gtb','zenith'],
  lifestyle:['health','food','recipe','travel','beauty','skin','wellness','fitness','diet','home','family','relationship','love','marriage','wedding','pregnancy','baby','church','pastor','bishop','fashion','hair','makeup'],
  tech:['technology','app','software','ai','artificial intelligence','internet','mobile','smartphone','data','cyber','blockchain','crypto','startup','elon','twitter','google','meta','facebook','microsoft','opay','flutterwave','paystack','kuda','moniepoint'],
};

const CAT_ICONS = {politics:'🏛️',entertainment:'🎬',sports:'⚽',business:'📈',lifestyle:'✨',tech:'💻',default:'📰'};
const CAT_THUMB = {politics:'thumb-politics',entertainment:'thumb-entertainment',sports:'thumb-sports',business:'thumb-business',lifestyle:'thumb-lifestyle',tech:'thumb-tech'};
const CAT_BG = {politics:'linear-gradient(135deg,#1a1a1a,#333)',entertainment:'linear-gradient(135deg,#3d1a6e,#1e0d36)',sports:'linear-gradient(135deg,#0d4726,#062d17)',business:'linear-gradient(135deg,#5c2800,#3a1800)',lifestyle:'linear-gradient(135deg,#4a003a,#2d0023)',tech:'linear-gradient(135deg,#002a5c,#001a38)',default:'linear-gradient(135deg,#1a1a1a,#333)'};

let allArticles = [];
let pendingArticles = [];
let savedArticles = JSON.parse(localStorage.getItem('fn_saved') || '[]');
let readArticles = new Set(JSON.parse(localStorage.getItem('fn_read') || '[]'));
let currentCat = 'all';
let deferredInstall = null;
let autoRefreshTimer = null;
let isDark = localStorage.getItem('fn_dark') === '1';

// ── INIT ──────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  if (isDark) document.body.classList.add('dark');
  updateDarkBtn();
  loadFeed();
  setupInstall();
  updateSavedBadge();
  scheduleAutoRefresh();
});

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredInstall = e;
  document.getElementById('installBanner').style.display = 'flex';
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  const {outcome} = await deferredInstall.userChoice;
  if (outcome === 'accepted') document.getElementById('installBanner').style.display = 'none';
});

function setupInstall() {
  if (navigator.serviceWorker) navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ── DARK MODE ─────────────────────────────────────────────────────────────
function toggleDark() {
  isDark = !isDark;
  document.body.classList.toggle('dark', isDark);
  localStorage.setItem('fn_dark', isDark ? '1' : '0');
  updateDarkBtn();
}
function updateDarkBtn() {
  document.getElementById('darkBtn').textContent = isDark ? '☀️' : '🌙';
}

// ── AUTO REFRESH ──────────────────────────────────────────────────────────
function scheduleAutoRefresh() {
  clearTimeout(autoRefreshTimer);
  autoRefreshTimer = setTimeout(silentRefresh, 10 * 60 * 1000);
}

async function silentRefresh() {
  const results = await Promise.allSettled(RSS_SOURCES.map(fetchSource));
  const fresh = results.flatMap(r => r.status === 'fulfilled' ? r.value : []);
  fresh.sort((a,b) => new Date(b.pubDate) - new Date(a.pubDate));
  const existingIds = new Set(allArticles.map(a => a.id));
  const newOnes = fresh.filter(a => !existingIds.has(a.id));
  if (newOnes.length > 0) {
    pendingArticles = fresh;
    const bar = document.getElementById('refreshBar');
    bar.textContent = `⚡ ${newOnes.length} new ${newOnes.length === 1 ? 'story' : 'stories'} — tap to load`;
    bar.classList.add('show');
    document.getElementById('newBadge').textContent = newOnes.length;
    document.getElementById('newBadge').classList.add('show');
  }
  scheduleAutoRefresh();
}

function applyNewArticles() {
  if (pendingArticles.length) {
    allArticles = pendingArticles;
    pendingArticles = [];
  }
  document.getElementById('refreshBar').classList.remove('show');
  document.getElementById('newBadge').classList.remove('show');
  updateBreakingTicker();
  renderFeed(currentCat);
  renderTrending();
  showToast('⚡ Feed updated!');
}

// ── FETCH ─────────────────────────────────────────────────────────────────
async function fetchSource(source) {
  try {
    const res = await fetch(source.url, {signal: AbortSignal.timeout(10000)});
    const data = await res.json();
    if (!data.items || data.status !== 'ok') return [];
    return data.items.slice(0, 12).map(item => {
      const title = (item.title || '').trim();
      const link = item.link || '#';
      const pubDate = item.pubDate || '';
      const description = (item.description || item.content || '').trim();
      const image = item.thumbnail || item.enclosure?.link || null;
      const cleanDesc = description.replace(/<[^>]+>/g,'').trim().slice(0,200);
      const cat = detectCat(title + ' ' + cleanDesc, source.cat);
      return {title, link, pubDate, description: cleanDesc, image, source: source.name, cat, id: safeB64(link)};
    });
  } catch(e) { return []; }
}

function safeB64(str) {
  try { return btoa(unescape(encodeURIComponent(str))).slice(0,20); }
  catch(e) { return Math.random().toString(36).slice(2,12); }
}

function detectCat(text, fallback) {
  const lower = text.toLowerCase();
  for (const [cat, keywords] of Object.entries(CAT_KEYWORDS)) {
    if (keywords.some(k => lower.includes(k))) return cat;
  }
  return fallback || 'default';
}

async function loadFeed() {
  document.getElementById('mainFeed').innerHTML = `<div class="loading-state"><div class="loading-spinner"></div><div>Fetching latest Naija news...</div></div>`;
  const results = await Promise.allSettled(RSS_SOURCES.map(fetchSource));
  allArticles = results.flatMap(r => r.status === 'fulfilled' ? r.value : []);
  allArticles.sort((a,b) => new Date(b.pubDate) - new Date(a.pubDate));
  if (allArticles.length === 0) {
    document.getElementById('mainFeed').innerHTML = `<div class="empty-state"><div class="empty-icon">📡</div><div class="empty-text">Could not load news. Check your connection and try refreshing.</div></div>`;
    return;
  }
  updateBreakingTicker();
  renderFeed(currentCat);
  renderTrending();
}

function refreshFeed() {
  showToast('⚡ Refreshing...');
  loadFeed();
}

// ── BREAKING TICKER ───────────────────────────────────────────────────────
function updateBreakingTicker() {
  const top = allArticles.slice(0,6).map(a => `<span class="breaking-item">⚡ ${a.title}</span>`).join('');
  document.getElementById('breakingTicker').innerHTML = top + top;
}

// ── RENDER ────────────────────────────────────────────────────────────────
function renderFeed(cat) {
  currentCat = cat;
  const filtered = cat === 'all' ? allArticles : allArticles.filter(a => a.cat === cat);
  if (filtered.length === 0) {
    document.getElementById('mainFeed').innerHTML = `<div class="empty-state"><div class="empty-icon">${CAT_ICONS[cat]||'📰'}</div><div class="empty-text">No ${cat} news found right now.</div></div>`;
    return;
  }
  const [featured, ...rest] = filtered;
  let html = '';
  html += `<div class="section-label">⚡ Top story</div>`;
  html += renderFeatured(featured);
  html += `<div class="ai-summary-box" id="aiBox_${featured.id}"></div>`;
  html += `<div class="section-label">📰 Latest flashes</div>`;
  rest.slice(0,40).forEach(a => { html += renderCard(a); });
  html += renderTrendingInline();
  document.getElementById('mainFeed').innerHTML = html;
}

function renderFeatured(a) {
  const saved = savedArticles.some(s => s.id === a.id);
  const bg = CAT_BG[a.cat] || CAT_BG.default;
  const imgHtml = a.image
    ? `<img src="${esc(a.image)}" alt="" onerror="this.style.display='none'"/><div class="featured-img-fallback">${CAT_ICONS[a.cat]||'📰'}</div>`
    : `<div class="featured-img-fallback">${CAT_ICONS[a.cat]||'📰'}</div>`;
  return `
  <div class="featured-card">
    <div class="featured-img" style="background:${bg}" onclick="openArticle('${esc(a.link)}','${a.id}')">
      ${imgHtml}
      <div class="featured-overlay">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span class="featured-badge">⚡ TOP FLASH</span>
          <span class="featured-source-pill">${esc(a.source)}</span>
        </div>
      </div>
    </div>
    <div class="featured-body">
      <div class="featured-title" onclick="openArticle('${esc(a.link)}','${a.id}')">${esc(a.title)}</div>
      <div class="featured-meta">
        <div class="meta-left">
          <span class="time-tag">🕐 ${timeAgo(a.pubDate)}</span>
          <button class="ai-btn" onclick="getAISummary('${a.id}','${escJ(a.title)}','${escJ(a.description)}')">✨ AI</button>
          <button class="wa-btn" onclick="shareWA('${escJ(a.title)}','${escJ(a.link)}')">📲 WhatsApp</button>
        </div>
        <div class="action-btns">
          <button class="icon-btn" onclick="saveArticle(${safeJson(a)},'${a.id}',this)">${saved?'🔖':'🔗'}</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderCard(a) {
  const thumbClass = CAT_THUMB[a.cat] || 'thumb-default';
  const catClass = 'cat-' + (a.cat || 'default');
  const saved = savedArticles.some(s => s.id === a.id);
  const isRead = readArticles.has(a.id);
  const imgHtml = a.image
    ? `<img src="${esc(a.image)}" alt="" onerror="this.style.display='none'"/><span class="thumb-emoji">${CAT_ICONS[a.cat]||'📰'}</span>`
    : `<span class="thumb-emoji">${CAT_ICONS[a.cat]||'📰'}</span>`;
  return `
  <div class="news-card${isRead?' read':''}" onclick="openArticle('${esc(a.link)}','${a.id}')">
    <div class="news-thumb ${thumbClass}">${imgHtml}</div>
    <div class="news-body">
      <div class="news-cat ${catClass}">${(a.cat||'news').toUpperCase()}</div>
      <div class="news-title">${esc(a.title)}</div>
      <div class="news-foot">
        <span class="news-source">${esc(a.source)} · ${timeAgo(a.pubDate)}</span>
        <div class="news-actions">
          <button onclick="event.stopPropagation();shareWA('${escJ(a.title)}','${escJ(a.link)}')" title="Share on WhatsApp">📲</button>
          <button onclick="event.stopPropagation();saveArticle(${safeJson(a)},'${a.id}',this)" title="Save">${saved?'🔖':'🔗'}</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderTrendingInline() {
  const keywords = extractTrending();
  if (!keywords.length) return '';
  const tags = keywords.map(k => `<span class="trend-tag" onclick="doSearchFromTag('${k}')">#${k}</span>`).join('');
  return `<div class="trending-section"><div class="trend-header">🔥 Trending in Nigeria</div><div class="trend-tags">${tags}</div></div>`;
}

function renderTrending() {
  const keywords = extractTrending(24);
  const tags = keywords.map(k => `<span class="trend-tag" onclick="doSearchFromTag('${k}')">#${k}</span>`).join('');
  const sources = RSS_SOURCES.map(s => `
    <div class="source-card">
      <span class="source-dot"></span>
      <span style="font-size:14px;font-weight:600;">${s.name}</span>
      <span style="margin-left:auto;font-size:11px;color:var(--text2);">LIVE</span>
    </div>`).join('');
  document.getElementById('trendingFull').innerHTML = `
    <p style="font-size:13px;color:var(--text2);margin-bottom:12px;">Most talked-about topics right now across Nigerian news.</p>
    <div class="trend-tags" style="gap:10px;margin-bottom:24px;">${tags}</div>
    <div class="section-label">📡 Live Sources</div>${sources}`;
}

// ── SMARTER TRENDING ──────────────────────────────────────────────────────
function extractTrending(n=12) {
  const stopwords = new Set(['the','and','for','that','with','this','from','have','been','will','were','are','was','its','into','also','more','than','over','after','but','not','all','has','had','new','can','said','says','who','about','what','when','how','one','two','they','their','them','his','her','our','out','any','may','which','just','her','him','she','top','ago','now','like','says','post','state','world','first','appeared','latest']);
  const naijaPriority = new Set(['tinubu','naira','nigeria','lagos','abuja','senate','inec','dangote','buhari','obi','atiku','nollywood','afrobeats','super eagles','afcon','cbn','efcc','nnpc','ndlea']);
  const freq = {};
  allArticles.forEach(a => {
    const words = (a.title).toLowerCase().match(/\b[a-z]{4,}\b/g) || [];
    words.forEach(w => {
      if (!stopwords.has(w)) {
        const boost = naijaPriority.has(w) ? 3 : 1;
        freq[w] = (freq[w]||0) + boost;
      }
    });
  });
  return Object.entries(freq)
    .sort((a,b) => b[1]-a[1])
    .slice(0,n)
    .map(([w]) => w.charAt(0).toUpperCase()+w.slice(1));
}

// ── AI SUMMARY ────────────────────────────────────────────────────────────
async function getAISummary(id, title, desc) {
  const box = document.getElementById('aiBox_' + id);
  if (!box) return;
  if (box.classList.contains('visible') && box.dataset.loaded) {
    box.classList.remove('visible');
    return;
  }
  box.classList.add('visible');
  box.textContent = '✨ Generating AI summary...';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        system:'You are a concise Nigerian news summarizer. Summarize in 2-3 sentences, plain English. Start with the key fact. Be direct.',
        messages:[{role:'user',content:`Title: ${title}\nSnippet: ${desc}\n\nSummarize this Nigerian news article in 2-3 sentences.`}]
      })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || 'Summary unavailable.';
    box.dataset.loaded = '1';
    box.innerHTML = `<strong>⚡ AI Summary:</strong> ${text}`;
  } catch(e) {
    box.textContent = 'Summary unavailable. Tap to open full article.';
  }
}

// ── WHATSAPP SHARE ────────────────────────────────────────────────────────
function shareWA(title, url) {
  event.stopPropagation();
  const msg = encodeURIComponent(`⚡ *${title}*\n\nRead more: ${url}\n\n_Via Flash Nigeria — flash-nigeria.vercel.app_`);
  window.open(`https://wa.me/?text=${msg}`, '_blank');
}

// ── SAVE / READ ───────────────────────────────────────────────────────────
function saveArticle(article, id, btn) {
  event.stopPropagation();
  const exists = savedArticles.findIndex(s => s.id === id);
  if (exists >= 0) {
    savedArticles.splice(exists, 1);
    btn.textContent = '🔗';
    showToast('Removed from saved');
  } else {
    savedArticles.push(article);
    btn.textContent = '🔖';
    showToast('⚡ Article saved!');
  }
  localStorage.setItem('fn_saved', JSON.stringify(savedArticles));
  updateSavedBadge();
}

function updateSavedBadge() {
  const b = document.getElementById('savedBadge');
  if (savedArticles.length > 0) {
    b.textContent = savedArticles.length;
    b.classList.add('show');
  } else {
    b.classList.remove('show');
  }
}

function markRead(id) {
  readArticles.add(id);
  localStorage.setItem('fn_read', JSON.stringify([...readArticles]));
}

function renderSaved() {
  if (savedArticles.length === 0) {
    document.getElementById('savedList').innerHTML = `<div class="empty-state"><div class="empty-icon">🔖</div><div class="empty-text">No saved articles yet.<br>Tap 🔗 on any story to save it.</div></div>`;
    return;
  }
  document.getElementById('savedList').innerHTML = savedArticles.map(a => renderCard(a)).join('');
}

// ── SEARCH ────────────────────────────────────────────────────────────────
function doSearch(query) {
  if (!query.trim()) { document.getElementById('searchResults').innerHTML=''; return; }
  const q = query.toLowerCase();
  const results = allArticles.filter(a => a.title.toLowerCase().includes(q) || a.description.toLowerCase().includes(q));
  if (results.length === 0) {
    document.getElementById('searchResults').innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">No results for "${esc(query)}"</div></div>`;
    return;
  }
  document.getElementById('searchResults').innerHTML = results.slice(0,20).map(a => renderCard(a)).join('');
}

function doSearchFromTag(keyword) {
  switchPage('search', document.querySelector('[data-page="search"]'));
  document.getElementById('searchInput').value = keyword;
  doSearch(keyword);
}

// ── NAV ───────────────────────────────────────────────────────────────────
function switchPage(page, btn) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ['home','trending','search','saved'].forEach(p => {
    const el = document.getElementById('page-' + p);
    if (el) el.style.display = p === page ? 'block' : 'none';
  });
  if (page === 'saved') renderSaved();
  if (page === 'search') document.getElementById('searchInput').focus();
}

document.getElementById('catBar').addEventListener('click', e => {
  const btn = e.target.closest('.cat-btn');
  if (!btn) return;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderFeed(btn.dataset.cat);
});

// ── UTILS ─────────────────────────────────────────────────────────────────
function openArticle(url, id) {
  if (id) markRead(id);
  if (url && url !== '#') window.open(url, '_blank', 'noopener');
}

function timeAgo(dateStr) {
  if (!dateStr) return 'just now';
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff/60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins/60);
  if (hrs < 24) return hrs + 'hr ago';
  return Math.floor(hrs/24) + 'd ago';
}

function esc(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escJ(str) {
  return (str||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\n/g,' ').slice(0,300);
}
function safeJson(a) {
  return JSON.stringify(a).replace(/"/g,'&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
